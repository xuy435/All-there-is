<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All There Is</title>
    <style>
        @font-face {
            font-family: "Firstland";
            src: url("Firstland-Demo.otf") format("opentype"),
                 url("Firstland%20Demo.otf") format("opentype");
        }
        html, body {
            margin: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        #puddle {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            touch-action: none;
            display: block;
        }
        #header {
            position: fixed;
            top: 0; left: 0; right: 0;
            display: flex;
            justify-content: space-between;
            padding: 28px 32px;
            color: #e8e8e8;
            font: 400 11px/1 "Courier New", Courier, monospace;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            pointer-events: none;
        }
        #header a { color: inherit; text-decoration: none; pointer-events: auto; }
        #hint {
            position: fixed;
            left: 50%;
            bottom: 6vh;
            transform: translateX(-50%);
            color: #fff;
            font: 400 11px/1 "Courier New", Courier, monospace;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.2s ease;
        }
        #hint.show { opacity: 0.6; }
    </style>
</head>
<body>
    <canvas id="puddle"></canvas>
    <div id="header">
        <span>Yue Xu</span>
        <span>An interactive visual-audio experience</span>
        <a href="#">About</a>
    </div>
    <div id="hint"></div>

    <script>
    // ---------- SETTINGS (tweak these) ----------
    const USE_IMAGE   = false;  // false = plain black background, true = use the photo below
    const IMAGE_SRC   = "puddle.jpg";              // put your photo next to this file
    const SOUND_SRC   = "water-drop-sound.mp3";    // your mp3, same folder
    const TITLE       = "All There Is";
    const TITLE_COLOR = "#e8e8e8";
    const TITLE_WIDTH = 0.92;   // title width as a fraction of the screen width
    const SCALE       = 0.75;   // simulation resolution (lower = faster, higher = sharper text)
    const DAMPING     = 6;      // higher = ripples last longer (try 4–7)
    const DROP_RADIUS = 24;     // size of the click splash (in sim pixels)
    const DROP_FORCE  = 1400;   // strength of the click
    const REFRACTION  = 0.09;   // how much the image bends
    const SHINE       = 0.05;   // highlight on ripple crests
    const CHROMA      = 0.35;   // color-fringe strength (0 = off)

    // ---------- SETUP ----------
    const canvas = document.getElementById("puddle");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const hint = document.getElementById("hint");

    let w, h, size, src, out, outData, cur, prev;
    const img = new Image();
    let imgReady = false;

    function drawSource(off) {
        const c = off.getContext("2d");
        if (USE_IMAGE && imgReady) {
            // "cover" fit
            const s = Math.max(w / img.width, h / img.height);
            const dw = img.width * s, dh = img.height * s;
            c.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
        } else {
            c.fillStyle = "#000";
            c.fillRect(0, 0, w, h);
        }

        // title lives inside the "water", so ripples bend it
        c.fillStyle = TITLE_COLOR;
        c.textAlign = "center";
        c.textBaseline = "middle";
        c.font = "100px Firstland, cursive";
        const measured = c.measureText(TITLE).width;
        const fontSize = 100 * (w * TITLE_WIDTH) / measured;
        c.font = fontSize + "px Firstland, cursive";
        c.fillText(TITLE, w / 2, h / 2);
    }

    function resize() {
        canvas.width  = Math.max(2, Math.floor(window.innerWidth  * SCALE));
        canvas.height = Math.max(2, Math.floor(window.innerHeight * SCALE));
        w = canvas.width;
        h = canvas.height;
        size = w * h;

        const off = document.createElement("canvas");
        off.width = w; off.height = h;
        drawSource(off);
        src = off.getContext("2d").getImageData(0, 0, w, h).data;

        out = ctx.createImageData(w, h);
        outData = out.data;
        cur  = new Int32Array(size);
        prev = new Int32Array(size);
    }

    // ---------- WATER ----------
    function drop(x, y) {
        const r = DROP_RADIUS;
        for (let j = -r; j <= r; j++) {
            for (let i = -r; i <= r; i++) {
                const px = x + i, py = y + j;
                if (px < 1 || py < 1 || px >= w - 1 || py >= h - 1) continue;
                const d = Math.sqrt(i * i + j * j);
                if (d <= r) {
                    // smooth dome, pushes the surface down
                    cur[py * w + px] -= DROP_FORCE * (1 - d / r);
                }
            }
        }
    }

    function step() {
        for (let y = 1; y < h - 1; y++) {
            let i = y * w + 1;
            for (let x = 1; x < w - 1; x++, i++) {
                let v = ((cur[i - 1] + cur[i + 1] + cur[i - w] + cur[i + w]) >> 1) - prev[i];
                v -= v >> DAMPING;
                prev[i] = v;
            }
        }
        const t = cur; cur = prev; prev = t;
    }

    function clamp(v, max) { return v < 0 ? 0 : v > max ? max : v; }

    function render() {
        const wm = w - 1, hm = h - 1;
        for (let y = 1; y < hm; y++) {
            for (let x = 1; x < wm; x++) {
                const i = y * w + x;
                const dx = cur[i - 1] - cur[i + 1];
                const dy = cur[i - w] - cur[i + w];
                const ox = dx * REFRACTION, oy = dy * REFRACTION;

                // sample each channel at a slightly different offset = color fringe
                const rx = clamp((x + ox * (1 + CHROMA)) | 0, wm), ry = clamp((y + oy * (1 + CHROMA)) | 0, hm);
                const gx = clamp((x + ox) | 0, wm),                gy = clamp((y + oy) | 0, hm);
                const bx = clamp((x + ox * (1 - CHROMA)) | 0, wm), by = clamp((y + oy * (1 - CHROMA)) | 0, hm);

                const shine = USE_IMAGE ? (dx + dy) * SHINE : (Math.abs(dx) + Math.abs(dy)) * SHINE * 1.5;
                const o = i * 4;
                outData[o]     = src[(ry * w + rx) * 4]     + shine;
                outData[o + 1] = src[(gy * w + gx) * 4 + 1] + shine;
                outData[o + 2] = src[(by * w + bx) * 4 + 2] + shine;
                outData[o + 3] = 255;
            }
        }
        ctx.putImageData(out, 0, 0);
    }

    function loop() {
        step();
        render();
        requestAnimationFrame(loop);
    }

    // ---------- SOUND ----------
    const dropSound = new Audio(SOUND_SRC);
    dropSound.preload = "auto";
    function showAudioError() {
        hint.textContent = "Can't load " + SOUND_SRC + " \u2014 check the file name and folder";
        hint.classList.add("show");
    }
    function playDrop() {
        // a fresh Audio each click so rapid clicks overlap
        const s = new Audio(SOUND_SRC);
        s.volume = 0.8;
        s.addEventListener("error", showAudioError);
        s.play().catch((err) => {
            console.warn("Sound failed:", err);
            if (err.name !== "NotAllowedError") showAudioError();
        });
    }

    // ---------- INTERACTION ----------
    canvas.addEventListener("pointerdown", (e) => {
        const x = Math.floor(e.clientX * SCALE);
        const y = Math.floor(e.clientY * SCALE);
        drop(x, y);
        playDrop();
    });

    window.addEventListener("resize", resize);

    // ---------- START ----------
    img.onload = () => { imgReady = true; resize(); };
    img.onerror = () => { /* keeps fallback gradient */ };
    if (USE_IMAGE) img.src = IMAGE_SRC;
    resize();
    document.fonts.load("100px Firstland").then(resize).catch(() => {});
    loop();
    </script>
</body>
</html>
