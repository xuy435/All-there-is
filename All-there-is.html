<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All There Is</title>
    <style>
        @font-face {
            font-family: "Firstland";
            src: url("Firstland-Demo.otf") format("opentype"),
                 url("Firstland%20Demo.otf") format("opentype");
        }
        html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
        #puddle {
            position: fixed; inset: 0; width: 100%; height: 100%;
            cursor: crosshair; touch-action: none; display: block;
        }
        #layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
        .piece {
            position: absolute;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
        }
        #frame {
            position: fixed; display: none; pointer-events: none;
            border: 1px solid rgba(232, 232, 232, 0.9);
            background: rgba(232, 232, 232, 0.06);
            box-sizing: border-box;
        }
        #header {
            position: fixed; top: 0; left: 0; right: 0;
            display: flex; justify-content: space-between;
            padding: 28px 32px; color: #e8e8e8;
            font: 400 11px/1 "Courier New", Courier, monospace;
            letter-spacing: 0.12em; text-transform: uppercase;
            pointer-events: none;
        }
        #header a { color: inherit; text-decoration: none; pointer-events: auto; }
        #hint {
            position: fixed; left: 50%; bottom: 6vh; transform: translateX(-50%);
            color: #fff; font: 400 11px/1 "Courier New", Courier, monospace;
            letter-spacing: 0.12em; text-transform: uppercase;
            opacity: 0; pointer-events: none; transition: opacity 1.2s ease;
        }
        #hint.show { opacity: 0.6; }
    </style>
</head>
<body>
    <canvas id="puddle"></canvas>
    <div id="layer"></div>
    <div id="frame"></div>
    <div id="header">
        <span>Yue Xu</span>
        <span>An interactive visual-audio experience</span>
        <a href="#">About</a>
    </div>
    <div id="hint"></div>

    <script>
    // ---------- SETTINGS (tweak these) ----------
    const TITLE        = "All There Is";
    const TITLE_COLOR  = "#e8e8e8";
    const TITLE_WIDTH  = 0.92;    // title width as a fraction of the screen width
    const TITLE_FADE_MS = 2000;   // how long the title takes to fade once you start dragging
    const REVEAL_MS    = 2500;    // how long each image takes to fade in
    const MIN_BOX      = 24;      // smallest box (px) that counts as a frame
    const FRAGMENT_MODE = false;  // false = whole photo fitted into the box; true = box acts as a window onto a full-screen photo

    // Photo ids. The page tries each id with a few folder / file-name variations
    // (images/ or same folder; "-copy", " copy" or no suffix), so renaming won't break it.
    const IMAGE_IDS = [
        "img1.jpg", "img2.jpg", "img3.jpg", "img4.jpg", "img5.jpg",
        "img6.jpg", "img7.jpg", "img8.jpg", "img9.jpg", "img10.jpg"
    ];
    const IMAGE_FOLDERS = [""];

    const SOUND_SRC    = "water-drop-sound.mp3";
    const SCALE        = 0.75;    // water resolution (lower = faster, higher = sharper title)
    const DAMPING      = 6;
    const DROP_RADIUS  = 24;
    const DROP_FORCE   = 1400;
    const REFRACTION   = 0.09;
    const SHINE        = 0.05;
    const CHROMA       = 0.35;

    // ---------- SETUP ----------
    const canvas = document.getElementById("puddle");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const hint = document.getElementById("hint");
    const frame = document.getElementById("frame");
    const layer = document.getElementById("layer");

    let w, h, size, src, out, outData, cur, prev;
    let fontReady = false;      // title stays hidden until Firstland has loaded
    let fadeStart = null;       // set when the first drag begins
    let titleAlpha = 1;

    function showMessage(text) {
        hint.textContent = text;
        hint.classList.add("show");
    }

    function drawSource(off) {
        const c = off.getContext("2d");
        c.fillStyle = "#000";
        c.fillRect(0, 0, w, h);
        if (!fontReady) return;
        c.fillStyle = TITLE_COLOR;
        c.textAlign = "center";
        c.textBaseline = "middle";
        c.font = "100px Firstland, cursive";
        const measured = c.measureText(TITLE).width;
        c.font = (100 * (w * TITLE_WIDTH) / measured) + "px Firstland, cursive";
        c.fillText(TITLE, w / 2, h / 2);
    }

    function resize() {
        canvas.width  = Math.max(2, Math.floor(window.innerWidth  * SCALE));
        canvas.height = Math.max(2, Math.floor(window.innerHeight * SCALE));
        w = canvas.width; h = canvas.height; size = w * h;
        const off = document.createElement("canvas");
        off.width = w; off.height = h;
        drawSource(off);
        src = off.getContext("2d").getImageData(0, 0, w, h).data;
        out = ctx.createImageData(w, h);
        outData = out.data;
        cur  = new Int32Array(size);
        prev = new Int32Array(size);
    }

    // ---------- WATER ----------
    function drop(x, y) {
        const r = DROP_RADIUS;
        for (let j = -r; j <= r; j++) {
            for (let i = -r; i <= r; i++) {
                const px = x + i, py = y + j;
                if (px < 1 || py < 1 || px >= w - 1 || py >= h - 1) continue;
                const d = Math.sqrt(i * i + j * j);
                if (d <= r) cur[py * w + px] -= DROP_FORCE * (1 - d / r);
            }
        }
    }

    function step() {
        for (let y = 1; y < h - 1; y++) {
            let i = y * w + 1;
            for (let x = 1; x < w - 1; x++, i++) {
                let v = ((cur[i - 1] + cur[i + 1] + cur[i - w] + cur[i + w]) >> 1) - prev[i];
                v -= v >> DAMPING;
                prev[i] = v;
            }
        }
        const t = cur; cur = prev; prev = t;
    }

    function clamp(v, max) { return v < 0 ? 0 : v > max ? max : v; }

    function render() {
        const wm = w - 1, hm = h - 1;
        const a = titleAlpha;
        for (let y = 1; y < hm; y++) {
            for (let x = 1; x < wm; x++) {
                const i = y * w + x;
                const dx = cur[i - 1] - cur[i + 1];
                const dy = cur[i - w] - cur[i + w];
                const ox = dx * REFRACTION, oy = dy * REFRACTION;
                const rx = clamp((x + ox * (1 + CHROMA)) | 0, wm), ry = clamp((y + oy * (1 + CHROMA)) | 0, hm);
                const gx = clamp((x + ox) | 0, wm),                gy = clamp((y + oy) | 0, hm);
                const bx = clamp((x + ox * (1 - CHROMA)) | 0, wm), by = clamp((y + oy * (1 - CHROMA)) | 0, hm);
                const shine = (Math.abs(dx) + Math.abs(dy)) * SHINE * 1.5;
                const o = i * 4;
                outData[o]     = src[(ry * w + rx) * 4]     * a + shine;
                outData[o + 1] = src[(gy * w + gx) * 4 + 1] * a + shine;
                outData[o + 2] = src[(by * w + bx) * 4 + 2] * a + shine;
                outData[o + 3] = 255;
            }
        }
        ctx.putImageData(out, 0, 0);
    }

    function loop() {
        if (fadeStart !== null) {
            titleAlpha = Math.max(0, 1 - (performance.now() - fadeStart) / TITLE_FADE_MS);
        }
        step();
        render();
        requestAnimationFrame(loop);
    }

    // ---------- SOUND ----------
    function playDrop() {
        const s = new Audio(SOUND_SRC);
        s.volume = 0.8;
        s.addEventListener("error", () => showMessage("Can't load " + SOUND_SRC + " \u2014 check the file name and folder"));
        s.play().catch((err) => {
            console.warn("Sound failed:", err);
            if (err.name !== "NotAllowedError") showMessage("Can't load " + SOUND_SRC + " \u2014 check the file name and folder");
        });
    }

    // ---------- IMAGES ----------
    const urls = [];   // filled in with whichever file names actually load
    let pending = IMAGE_IDS.length;

    function candidatesFor(id) {
        const names = [id];
        const list = [];
        IMAGE_FOLDERS.forEach((f) => names.forEach((n) => list.push(encodeURI(f + n))));
        return list;
    }

    function findImage(id) {
        const list = candidatesFor(id);
        (function tryNext(i) {
            if (i >= list.length) {
                console.warn("No file found for " + id + ". Tried:", list);
                if (--pending === 0 && !urls.length) showMessage("Can't find the photos \u2014 put them in an images folder next to index.html");
                return;
            }
            const im = new Image();
            im.onload = () => { urls.push(list[i]); pending--; };
            im.onerror = () => tryNext(i + 1);
            im.src = list[i];
        })(0);
    }
    IMAGE_IDS.forEach(findImage);

    // shuffled "bag": every photo appears once before any repeats
    let bag = [], last = null;
    function nextImage() {
        if (!bag.length) {
            bag = urls.slice();
            for (let i = bag.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [bag[i], bag[j]] = [bag[j], bag[i]];
            }
            if (bag.length > 1 && bag[bag.length - 1] === last) bag.unshift(bag.pop());
        }
        if (!bag.length) return null;
        last = bag.pop();
        return last;
    }

    function revealImage(r) {
        const p = document.createElement("div");
        p.className = "piece";
        p.style.left = r.x + "px";
        p.style.top = r.y + "px";
        p.style.width = r.w + "px";
        p.style.height = r.h + "px";
        const u = nextImage();
        if (!u) { showMessage("Photos not found \u2014 put them in an images folder next to index.html"); return; }
        p.style.backgroundImage = 'url("' + u + '")';
        if (FRAGMENT_MODE) p.style.backgroundAttachment = "fixed";
        p.style.transition = "opacity " + REVEAL_MS + "ms ease";
        layer.appendChild(p);
        void p.offsetWidth;          // make sure the fade starts from 0
        p.style.opacity = 1;
    }

    // ---------- INTERACTION ----------
    let dragging = false, moved = false, sx = 0, sy = 0, ex = 0, ey = 0;
    const DRAG_MIN = 6;

    function boxFrom() {
        return { x: Math.min(sx, ex), y: Math.min(sy, ey), w: Math.abs(ex - sx), h: Math.abs(ey - sy) };
    }

    canvas.addEventListener("pointerdown", (e) => {
        dragging = true; moved = false;
        sx = ex = e.clientX; sy = ey = e.clientY;
        canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        ex = e.clientX; ey = e.clientY;
        if (!moved && Math.hypot(ex - sx, ey - sy) >= DRAG_MIN) {
            moved = true;
            frame.style.display = "block";
            if (fadeStart === null) fadeStart = performance.now();   // title starts fading
        }
        if (moved) {
            const b = boxFrom();
            frame.style.left = b.x + "px"; frame.style.top = b.y + "px";
            frame.style.width = b.w + "px"; frame.style.height = b.h + "px";
        }
    });

    function endDrag(e, cancelled) {
        if (!dragging) return;
        dragging = false;
        frame.style.display = "none";
        if (cancelled) return;
        if (!moved) {                        // a plain click = water drop + sound
            drop(Math.floor(e.clientX * SCALE), Math.floor(e.clientY * SCALE));
            playDrop();
        } else {
            const b = boxFrom();
            if (b.w >= MIN_BOX && b.h >= MIN_BOX) revealImage(b);
        }
    }
    canvas.addEventListener("pointerup", (e) => endDrag(e, false));
    canvas.addEventListener("pointercancel", (e) => endDrag(e, true));

    window.addEventListener("resize", resize);

    // ---------- START ----------
    resize();
    const fontDone = () => { fontReady = true; resize(); };
    document.fonts.load("100px Firstland").then(fontDone, fontDone);
    loop();
    </script>
</body>
</html>
